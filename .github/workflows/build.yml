name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Compile
        run: gcc -Wall -Wextra snake.c -o snake -lncurses